<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d9e3f2">
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <header class="page-header">
        <p class="eyebrow">MINESWEEPER</p>
        <h1>지뢰찾기</h1>
        <p class="instructions">안전한 칸을 모두 열어 승리하세요. 우클릭으로 표시를 바꿀 수 있어요.</p>
      </header>

      <section class="game-shell" aria-label="지뢰찾기 게임">
        <div class="toolbar">
          <label for="difficulty">난이도</label>
          <select id="difficulty" name="difficulty">
            <option value="easy">초급</option>
            <option value="medium">중급</option>
            <option value="hard">고급</option>
          </select>
        </div>

        <div class="status-panel">
          <output id="mine-counter" class="digital-display" aria-label="남은 지뢰 수">010</output>
          <button id="restart" class="restart-button" type="button" aria-label="새 게임">🙂</button>
          <output id="timer" class="digital-display" aria-label="경과 시간">000</output>
        </div>

        <div class="board-viewport">
          <div id="board" class="board" role="grid" aria-label="지뢰찾기 보드"></div>
        </div>
        <p id="game-message" class="game-message" role="status" aria-live="polite">난이도를 선택하고 게임을 시작하세요.</p>
      </section>
    </main>
  </body>
</html>
