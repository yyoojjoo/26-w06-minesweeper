<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#c0c0c0">
    <title>지뢰찾기</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="game">
      <section class="game-shell" aria-label="지뢰찾기 게임">
        <header class="top-bar">
          <div class="title-bar">
            <span class="title-icon" aria-hidden="true">✹</span>
            <h1>지뢰찾기</h1>
          </div>
          <nav class="difficulty-tabs" aria-label="난이도 선택">
            <button class="difficulty-button is-selected" type="button" data-difficulty="easy" aria-pressed="true">초급</button>
            <button class="difficulty-button" type="button" data-difficulty="medium" aria-pressed="false">중급</button>
            <button class="difficulty-button" type="button" data-difficulty="hard" aria-pressed="false">고급</button>
          </nav>
        </header>

        <div class="status-panel">
          <output id="mine-counter" class="digital-display" aria-label="남은 지뢰 수">010</output>
          <button id="restart" class="restart-button" type="button" aria-label="새 게임">🙂</button>
          <output id="timer" class="digital-display" aria-label="경과 시간">000</output>
        </div>

        <div class="board-viewport">
          <div id="board" class="board" role="grid" aria-label="지뢰찾기 보드"></div>
        </div>
        <p id="game-message" class="game-message" role="status" aria-live="polite">난이도를 선택하고 게임을 시작하세요.</p>
      </section>
    </main>
  </body>
</html>
